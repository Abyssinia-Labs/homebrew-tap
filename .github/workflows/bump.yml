# Write Formula/latem.rb for the latest latem release, test it on macOS and
# Linux, and push it.
#
# bin/bump verifies the release's checksums manifest against latem.pub before
# it writes a single sha256, so a formula here only carries what latem's
# release key signed. The hourly check is one GitHub API call and exits; the
# test and publish jobs run only when there is a release to write.
#
# Pushes made with GITHUB_TOKEN start no workflow, so test.yml never sees this
# job's commit: the test job below is that check, run before the push.

name: bump

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Release to write, e.g. v0.3.1 (default: the latest)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: bump
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: echo "version=$(bin/bump --check ${VERSION:+"$VERSION"})" >> "$GITHUB_OUTPUT"

  test:
    needs: check
    if: needs.check.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v5
      - name: brew and minisign
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            # The runner image has Homebrew, off PATH.
            printf '%s\n' /home/linuxbrew/.linuxbrew/bin /home/linuxbrew/.linuxbrew/sbin >> "$GITHUB_PATH"
            sudo apt-get update -qq
            sudo apt-get install -y -qq minisign
          else
            brew install minisign
          fi
      - name: write the formula
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: bin/bump "$VERSION"
      - name: install and test it
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          # brew taps a committed tree, so commit here; nothing is pushed.
          git add Formula/latem.rb
          git -c user.name=ci -c user.email=ci@localhost commit -qm "latem $VERSION"
          brew tap abyssinia-labs/tap "$GITHUB_WORKSPACE"
          brew install abyssinia-labs/tap/latem
          brew test abyssinia-labs/tap/latem
          brew audit --strict --online abyssinia-labs/tap/latem
          "$(brew --prefix)/bin/latem" version

  publish:
    needs: [check, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign
      - name: write and push the formula
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          bin/bump "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/latem.rb
          git commit -m "latem $VERSION"
          git push origin HEAD:main
