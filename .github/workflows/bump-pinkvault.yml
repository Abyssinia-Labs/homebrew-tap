# Write Formula/pinkvault.rb for the latest PinkVault release, test it on
# macOS and Linux, and push it. bump.yml does the same for latem.
#
# bin/bump-pinkvault verifies the release's checksums manifest against
# pinkvault.pub before it writes a single sha256, so the formula only carries
# what PinkVault's release key signed. The hourly check is one GitHub API call
# and exits; the test and publish jobs run only when there is a release to
# write.
#
# The first time, the same change renames latem-vault to pinkvault
# (bin/bump-pinkvault says how), so the test job first installs latem-vault
# 0.6.0 and checks that brew update and brew upgrade take it to pinkvault.
#
# Pushes made with GITHUB_TOKEN start no workflow, so test.yml never sees this
# job's commit: the test job below is that check, run before the push.

name: bump-pinkvault

on:
  schedule:
    - cron: "53 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Release to write, e.g. v0.7.1 (default: the latest)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # bump.yml's group: both push to main, so they take turns.
  group: bump
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: echo "version=$(bin/bump-pinkvault --check ${VERSION:+"$VERSION"})" >> "$GITHUB_OUTPUT"

  test:
    needs: check
    if: needs.check.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: brew and minisign
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            # The runner image has Homebrew, off PATH.
            printf '%s\n' /home/linuxbrew/.linuxbrew/bin /home/linuxbrew/.linuxbrew/sbin >> "$GITHUB_PATH"
            sudo apt-get update -qq
            sudo apt-get install -y -qq minisign
          else
            brew install minisign
          fi
      - name: install latem-vault, to upgrade from
        if: hashFiles('Formula/latem-vault.rb') != ''
        run: |
          set -euo pipefail
          brew tap abyssinia-labs/tap "$GITHUB_WORKSPACE"
          brew install abyssinia-labs/tap/latem-vault
          echo "FROM_LATEM_VAULT=1" >> "$GITHUB_ENV"
      - name: write the formula
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: bin/bump-pinkvault "$VERSION"
      - name: install and test it
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          # brew taps a committed tree, so commit here; nothing is pushed.
          git add -A Formula formula_renames.json
          git -c user.name=ci -c user.email=ci@localhost commit -qm "pinkvault $VERSION"
          if [ -n "${FROM_LATEM_VAULT:-}" ]; then
            # What a machine with latem-vault 0.6.0 does: brew update pulls
            # the tap, sees the rename and moves the keg to pinkvault, then
            # brew upgrade installs this release.
            brew update
            brew upgrade abyssinia-labs/tap/pinkvault
            # The migrator leaves the old rack as a link to pinkvault's.
            test -L "$(brew --cellar)/latem-vault"
            "$(brew --prefix)/opt/pinkvault/bin/pinkvault" --version | grep -F "pinkvault $VERSION ("
          else
            brew tap abyssinia-labs/tap "$GITHUB_WORKSPACE"
            brew install abyssinia-labs/tap/pinkvault
          fi
          brew style abyssinia-labs/tap/pinkvault
          brew test abyssinia-labs/tap/pinkvault
          brew audit --strict --online abyssinia-labs/tap/pinkvault
          for name in pinkvault pink latem-vault openvault; do
            "$(brew --prefix)/bin/$name" --version
          done

  publish:
    needs: [check, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign
      - name: write and push the formula
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          bin/bump-pinkvault "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Formula formula_renames.json
          git commit -m "pinkvault $VERSION"
          git push origin HEAD:main
